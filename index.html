<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة Gobblet الخشبية ثلاثية الأبعاد</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2188456409802496"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --board-wood: #5c3a21;
      --board-inner: #3d2314;
      --cell-wood: #2b180d;
      --p1-light-wood: linear-gradient(135deg, #e6c896 0%, #d4a373 50%, #bc8a5f 100%);
      --p2-dark-wood: linear-gradient(135deg, #8b4513 0%, #5c2c0e 50%, #3a1a08 100%);
      --ring-gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 1.8rem;
      color: #f1f5f9;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .status {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: bold;
      color: #cbd5e1;
      height: 25px;
      text-align: center;
    }

    .game-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 450px;
    }

    .inventory {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: #1e293b;
      padding: 12px 20px;
      border-radius: 12px;
      width: 100%;
      border: 2px solid transparent;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .inventory.active {
      border-color: var(--ring-gold);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .inventory-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 5px;
      text-align: center;
    }

    .board-container {
      background: var(--board-wood);
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
      border: 4px solid #3d2314;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      background: var(--board-inner);
      padding: 12px;
      border-radius: 12px;
      width: 310px;
      height: 310px;
      box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
    }

    .cell {
      background: var(--cell-wood);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
    }

    .piece {
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 0 rgba(0,0,0,0.5), 0 8px 15px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .piece::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.15);
      width: 60%;
      height: 60%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .piece.p1 {
      background: var(--p1-light-wood);
      border: 2px solid #a37244;
    }

    .piece.p2 {
      background: var(--p2-dark-wood);
      border: 2px solid #231005;
    }

    .piece.size-3 { width: 80px; height: 80px; }
    .piece.size-2 { width: 60px; height: 60px; }
    .piece.size-1 { width: 40px; height: 40px; }

    .piece.selected {
      transform: translateY(-8px) scale(1.08);
      box-shadow: 0 12px 0 rgba(0,0,0,0.4), 0 0 15px var(--ring-gold);
      border-color: var(--ring-gold);
    }

    .reset-btn {
      padding: 10px 25px;
      font-size: 1rem;
      background-color: #d97706;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .reset-btn:hover {
      background-color: #b45309;
    }

    .reset-btn:active {
      transform: translateY(2px);
    }
  </style>
</head>
<body>

  <h1>لعبة Gobblet الخشبية</h1>
  <div class="status" id="status">دورك للعب (القطع الفاتحة)</div>

  <div class="game-layout">
    <div>
      <div class="inventory-title">الكمبيوتر (القطع الداكنة)</div>
      <div class="inventory" id="inv-p2"></div>
    </div>

    <div class="board-container">
      <div class="board" id="board">
        <div class="cell" data-idx="0"></div>
        <div class="cell" data-idx="1"></div>
        <div class="cell" data-idx="2"></div>
        <div class="cell" data-idx="3"></div>
        <div class="cell" data-idx="4"></div>
        <div class="cell" data-idx="5"></div>
        <div class="cell" data-idx="6"></div>
        <div class="cell" data-idx="7"></div>
        <div class="cell" data-idx="8"></div>
      </div>
    </div>

    <div>
      <div class="inventory-title">قطعك (الخشب الفاتح)</div>
      <div class="inventory active" id="inv-p1"></div>
    </div>

    <button class="reset-btn" onclick="initGame()">إعادة اللعب</button>
  </div>

  <script>
    let currentPlayer = 1;
    let selectedPiece = null;
    let boardState = Array(9).fill(null).map(() => []);
    let playerInventory = { 1: [3,3,2,2,1,1], 2: [3,3,2,2,1,1] };
    let isGameOver = false;

    const statusEl = document.getElementById('status');
    const inv1El = document.getElementById('inv-p1');
    const inv2El = document.getElementById('inv-p2');
    const cells = document.querySelectorAll('.cell');

    function initGame() {
      currentPlayer = 1;
      selectedPiece = null;
      isGameOver = false;
      boardState = Array(9).fill(null).map(() => []);
      playerInventory = { 1: [3,3,2,2,1,1], 2: [3,3,2,2,1,1] };
      
      updateStatus("دورك للعب (القطع الفاتحة)");
      renderInventories();
      renderBoard();
    }

    function updateStatus(msg) {
      statusEl.textContent = msg;
    }

    function renderInventories() {
      inv1El.innerHTML = '';
      inv2El.innerHTML = '';

      inv1El.classList.toggle('active', currentPlayer === 1 && !isGameOver);
      inv2El.classList.toggle('active', currentPlayer === 2 && !isGameOver);

      [1, 2].forEach(p => {
        const invEl = p === 1 ? inv1El : inv2El;
        const availableSizes = [...new Set(playerInventory[p])].sort((a,b) => b-a);

        availableSizes.forEach(size => {
          const piece = createPieceDOM(p, size);
          if (p === 1 && currentPlayer === 1 && !isGameOver) {
            piece.addEventListener('click', (e) => handleInventoryClick(p, size, piece, e));
          }
          invEl.appendChild(piece);
        });
      });
    }

    function createPieceDOM(player, size) {
      const piece = document.createElement('div');
      piece.className = `piece p${player} size-${size}`;
      piece.dataset.player = player;
      piece.dataset.size = size;
      return piece;
    }

    function handleInventoryClick(player, size, element, event) {
      if (isGameOver || player !== currentPlayer) return;

      clearSelection();
      selectedPiece = { source: 'inv', player, size, element };
      element.classList.add('selected');
      event.stopPropagation();
    }

    function renderBoard() {
      cells.forEach((cell, idx) => {
        cell.innerHTML = '';
        const stack = boardState[idx];
        if (stack.length > 0) {
          const topPiece = stack[stack.length - 1];
          const pieceEl = createPieceDOM(topPiece.player, topPiece.size);
          
          if (topPiece.player === 1 && currentPlayer === 1 && !isGameOver) {
            pieceEl.addEventListener('click', (e) => {
              clearSelection();
              selectedPiece = { 
                source: 'board', 
                player: topPiece.player, 
                size: topPiece.size, 
                fromIndex: idx, 
                element: pieceEl 
              };
              pieceEl.classList.add('selected');
              e.stopPropagation();
            });
          }

          cell.appendChild(pieceEl);
        }

        cell.onclick = () => {
          if (currentPlayer === 1) handleCellClick(idx);
        };
      });
    }

    function handleCellClick(cellIndex) {
      if (isGameOver || !selectedPiece) return;

      if (executeMove(selectedPiece, cellIndex)) {
        clearSelection();
        renderBoard();
        renderInventories();

        if (checkWin(1)) {
          isGameOver = true;
          updateStatus("🎉 مبروك! لقد هزمت الكمبيوتر!");
          return;
        }

        currentPlayer = 2;
        updateStatus("الكمبيوتر يفكر الآن...");
        renderInventories();

        setTimeout(makeAIMove, 700);
      }
    }

    function executeMove(move, targetIdx) {
      const stack = boardState[targetIdx];
      const topPiece = stack.length > 0 ? stack[stack.length - 1] : null;

      if (!topPiece || move.size > topPiece.size) {
        if (move.source === 'inv') {
          const invIdx = playerInventory[move.player].indexOf(move.size);
          if (invIdx > -1) playerInventory[move.player].splice(invIdx, 1);
        } else if (move.source === 'board') {
          boardState[move.fromIndex].pop();
        }

        boardState[targetIdx].push({ player: move.player, size: move.size });
        return true;
      }
      return false;
    }

    function clearSelection() {
      document.querySelectorAll('.piece.selected').forEach(p => p.classList.remove('selected'));
      selectedPiece = null;
    }

    function checkWin(player) {
      const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      return winPatterns.some(pattern => {
        return pattern.every(idx => {
          const stack = boardState[idx];
          if (stack.length === 0) return false;
          return stack[stack.length - 1].player === player;
        });
      });
    }

    function makeAIMove() {
      if (isGameOver) return;

      const validMoves = getAllValidMoves(2);
      if (validMoves.length === 0) return;

      let bestMove = null;

      for (let move of validMoves) {
        if (simulateMoveAndCheckWin(move, 2)) {
          bestMove = move;
          break;
        }
      }

      if (!bestMove) {
        for (let move of validMoves) {
          if (blocksPlayerWin(move)) {
            bestMove = move;
            break;
          }
        }
      }

      if (!bestMove) {
        bestMove = validMoves.find(m => {
          const stack = boardState[m.targetIdx];
          return stack.length > 0 && stack[stack.length - 1].player === 1;
        });
      }

      if (!bestMove) {
        bestMove = validMoves[Math.floor(Math.random() * validMoves.length)];
      }

      executeMove(bestMove, bestMove.targetIdx);
      renderBoard();
      renderInventories();

      if (checkWin(2)) {
        isGameOver = true;
        updateStatus("🤖 فاز الكمبيوتر! حظاً موفقاً المرة القادمة.");
        return;
      }

      currentPlayer = 1;
      updateStatus("دورك للعب (القطع الفاتحة)");
      renderInventories();
      renderBoard();
    }

    function getAllValidMoves(player) {
      const moves = [];
      const availableSizes = [...new Set(playerInventory[player])];

      availableSizes.forEach(size => {
        for (let i = 0; i < 9; i++) {
          const stack = boardState[i];
          const top = stack.length > 0 ? stack[stack.length - 1] : null;
          if (!top || size > top.size) {
            moves.push({ source: 'inv', player, size, targetIdx: i });
          }
        }
      });

      for (let from = 0; from < 9; from++) {
        const stack = boardState[from];
        if (stack.length > 0 && stack[stack.length - 1].player === player) {
          const topPiece = stack[stack.length - 1];
          for (let to = 0; to < 9; to++) {
            if (from === to) continue;
            const targetStack = boardState[to];
            const targetTop = targetStack.length > 0 ? targetStack[targetStack.length - 1] : null;
            if (!targetTop || topPiece.size > targetTop.size) {
              moves.push({ source: 'board', player, size: topPiece.size, fromIndex: from, targetIdx: to });
            }
          }
        }
      }

      return moves;
    }

    function simulateMoveAndCheckWin(move, player) {
      const targetStack = boardState[move.targetIdx];
      let fromStack = move.source === 'board' ? boardState[move.fromIndex] : null;

      if (fromStack) fromStack.pop();
      targetStack.push({ player: move.player, size: move.size });

      const hasWon = checkWin(player);

      targetStack.pop();
      if (fromStack) fromStack.push({ player: move.player, size: move.size });

      return hasWon;
    }

    function blocksPlayerWin(aiMove) {
      const playerMoves = getAllValidMoves(1);
      const playerWinMove = playerMoves.find(m => simulateMoveAndCheckWin(m, 1));
      
      if (playerWinMove) {
        return aiMove.targetIdx === playerWinMove.targetIdx;
      }
      return false;
    }

    initGame();
  </script>
</body>
</html>
